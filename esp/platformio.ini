; Pinball machine brain (Seeed XIAO ESP32-C6). All game logic lives here.
; See ../README.md.
;
;   pio run -t upload           flash over USB
;   pio run -e ota -t upload    flash over WiFi (needs src/secrets.h)

[platformio]
default_envs = usb

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv ; two 1.9 MB app slots for OTA
build_flags =
	-I../protocol

[env:usb]

[env:ota]
upload_protocol = espota
upload_port = pinball.local
