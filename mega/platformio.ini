; Pinball machine I/O board (Arduino Mega 2560).
; No game logic lives here. See ../README.md.

[env:megaatmega2560]
platform = atmelavr@5.2.0 ; pinned so builds stay the same
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags =
	-I../protocol
; Libraries are vendored in lib/ so this builds without the internet:
;   Adafruit LED Backpack 1.1.6 and Adafruit GFX 1.6.1 (no longer in the
;   PlatformIO registry), plus Playtune.
