<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinball</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23c9ccd6'/%3E%3Ccircle cx='5.5' cy='5.5' r='2' fill='white'/%3E%3C/svg%3E">
<style>
    :root {
        --bg: #0e0f13;
        --panel: #181a21;
        --line: #2a2d38;
        --text: #e9e9ee;
        --dim: #8a8d9a;
        --accent: #ff9a1f;
        --good: #3ccf6e;
        --bad: #ef4b4b;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.4 system-ui, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: .04em; }
    h2 { margin: 32px 0 12px; font-size: 14px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); }
    .status { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 14px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }
    .dot.on { background: var(--good); box-shadow: 0 0 8px var(--good); }

    .display {
        margin-top: 20px;
        padding: 18px 12px;
        background: #070707;
        border: 1px solid var(--line);
        border-radius: 10px;
        text-align: center;
        font: 700 clamp(28px, 9vw, 56px)/1 ui-monospace, "Courier New", monospace;
        letter-spacing: .18em;
        color: var(--accent);
        text-shadow: 0 0 12px rgba(255, 154, 31, .6);
        white-space: pre;
        overflow: hidden;
    }

    .modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .mode {
        text-align: left;
        padding: 16px;
        background: var(--panel);
        border: 2px solid var(--line);
        border-radius: 10px;
        color: inherit;
        font: inherit;
        cursor: pointer;
    }
    .mode:hover { border-color: var(--dim); }
    .mode.current { border-color: var(--accent); }
    .mode b { display: block; font-size: 18px; margin-bottom: 4px; }
    .mode span { display: block; color: var(--dim); font-size: 14px; }
    .mode .tag { margin-top: 10px; color: var(--accent); font-size: 13px; font-weight: 600; }
    .mode .tag:empty { display: none; }

    .scores { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .scores h3 { margin: 0; padding: 12px 16px; font-size: 16px; border-bottom: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 8px 16px; border-bottom: 1px solid var(--line); }
    tr:last-child td { border-bottom: 0; }
    td.rank { width: 3em; color: var(--dim); }
    td.score { font-variant-numeric: tabular-nums; font-weight: 600; }
    td.date { text-align: right; color: var(--dim); font-size: 14px; }
    tr:first-child td.score { color: var(--accent); }
    .empty { padding: 12px 16px; color: var(--dim); }
    .scores + .scores { margin-top: 12px; }
</style>
</head>
<body>
<main>
    <header>
        <h1>PINBALL</h1>
        <div class="status"><div class="dot" id="dot"></div><span id="status">connecting…</span></div>
    </header>

    <div class="display" id="display">        </div>

    <h2>Game mode</h2>
    <div class="modes" id="modes"></div>

    <h2>High scores</h2>
    <div id="scores"></div>
</main>

<script>
    const $ = (id) => document.getElementById(id);
    let lastModes = '';

    function el(tag, props = {}, ...children) {
        const e = Object.assign(document.createElement(tag), props);
        e.append(...children);
        return e;
    }

    function renderModes(state) {
        const key = JSON.stringify([state.currentMode, state.modes.map((m) => m.id)]);
        if (key === lastModes) return;
        lastModes = key;
        $('modes').replaceChildren(...state.modes.map((m) => {
            const current = m.id === state.currentMode;
            const button = el('button', { className: 'mode' + (current ? ' current' : '') },
                el('b', { textContent: m.name }),
                el('span', { textContent: m.description }),
                el('div', { className: 'tag', textContent: current ? '● Playing now · tap to restart' : '' }));
            button.onclick = () => selectMode(m, current);
            return button;
        }));
    }

    function renderScores(state) {
        $('scores').replaceChildren(...state.modes.filter((m) => m.highScores).map((m) => {
            const rows = m.highScores.map((s, i) => el('tr', {},
                el('td', { className: 'rank', textContent: i + 1 }),
                el('td', { className: 'score', textContent: s.score.toLocaleString() }),
                el('td', { className: 'date', textContent: s.date ? new Date(s.date).toLocaleDateString() : '' })));
            return el('div', { className: 'scores' },
                el('h3', { textContent: m.name }),
                rows.length ? el('table', {}, ...rows) : el('div', { className: 'empty', textContent: 'No scores yet.' }));
        }));
    }

    async function selectMode(mode, current) {
        const question = current
            ? `Restart ${mode.name}? Any game in progress ends.`
            : `Switch to ${mode.name}? Any game in progress ends.`;
        if (!confirm(question)) return;
        await fetch('/api/mode', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: mode.id }),
        });
        refresh();
    }

    async function refresh() {
        try {
            const state = await (await fetch('/api/state')).json();
            $('display').textContent = state.display;
            $('dot').className = 'dot' + (state.megaConnected ? ' on' : '');
            $('status').textContent = state.megaConnected ? 'machine connected' : 'machine not connected';
            renderModes(state);
            renderScores(state);
        } catch {
            $('dot').className = 'dot';
            $('status').textContent = 'Pi not responding';
        }
    }

    refresh();
    setInterval(refresh, 1000);
</script>
</body>
</html>
