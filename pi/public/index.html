<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinball</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23c9ccd6'/%3E%3Ccircle cx='5.5' cy='5.5' r='2' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>
</head>
<body>
<main>
    <header>
        <h1>PINBALL</h1>
        <div class="status"><div class="dot" id="dot"></div><span id="status">connecting…</span></div>
    </header>

    <div class="display" id="display">        </div>

    <h2>Game mode</h2>
    <div class="modes" id="modes"></div>

    <div class="heading">
        <h2>Scores</h2>
        <div class="sort">
            <button id="sortBest" class="on">Highest</button>
            <button id="sortRecent">Newest</button>
        </div>
    </div>
    <div id="scores"></div>

    <nav><a href="settings.html">Machine settings →</a></nav>
</main>

<script>
    let lastModes = '';
    let lastDisplay = '';

    // Scrolling messages go in a marquee, so they move smoothly between refreshes.
    function renderDisplay(d) {
        const key = JSON.stringify(d);
        if (key === lastDisplay) return; // a new marquee would restart the scroll
        lastDisplay = key;
        $('display').replaceChildren(d.scrolling ? el('marquee', { textContent: d.text, scrollAmount: 8 }) : d.text);
    }

    function renderModes(state) {
        const key = JSON.stringify([state.currentMode, state.modes.map((m) => m.id)]);
        if (key === lastModes) return;
        lastModes = key;
        $('modes').replaceChildren(...state.modes.map((m) => {
            const current = m.id === state.currentMode;
            const button = el('button', { className: 'mode' + (current ? ' current' : '') },
                el('b', { textContent: m.name }),
                el('span', { textContent: m.description }),
                el('div', { className: 'tag', textContent: current ? '● Playing now · tap to restart' : '' }));
            button.onclick = () => selectMode(m, current);
            return button;
        }));
    }

    // Every game's score (one per game). Highest first, or newest first.
    let sortBy = 'best';
    let lastScores = '';

    function setSort(by) {
        sortBy = by;
        $('sortBest').className = by === 'best' ? 'on' : '';
        $('sortRecent').className = by === 'recent' ? 'on' : '';
        lastScores = '';
        refresh();
    }
    $('sortBest').onclick = () => setSort('best');
    $('sortRecent').onclick = () => setSort('recent');

    function when(date) {
        if (!date) return '';
        const d = new Date(date);
        return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    function renderScores(state) {
        const key = JSON.stringify([sortBy, state.modes.map((m) => m.scores)]);
        if (key === lastScores) return; // keeps the list's scroll position
        lastScores = key;
        $('scores').replaceChildren(...state.modes.filter((m) => m.scores).map((m) => {
            const best = Math.max(0, ...m.scores.map((s) => s.score));
            const list = sortBy === 'best'
                ? [...m.scores].sort((a, b) => b.score - a.score)
                : [...m.scores].reverse();
            const rows = list.map((s, i) => el('tr', {},
                el('td', { className: 'rank', textContent: sortBy === 'best' ? i + 1 : '' }),
                el('td', { className: 'score' + (s.score === best ? ' top' : ''), textContent: s.score.toLocaleString() }),
                el('td', { className: 'best', textContent: sortBy === 'recent' && s.score === best ? 'BEST' : '' }),
                el('td', { className: 'date', textContent: when(s.date) })));
            return el('div', { className: 'scores' },
                el('h3', { textContent: `${m.name}  ·  ${m.scores.length} game${m.scores.length === 1 ? '' : 's'}` }),
                rows.length
                    ? el('div', { className: 'list' }, el('table', {}, ...rows))
                    : el('div', { className: 'empty', textContent: 'No scores yet.' }));
        }));
    }

    async function selectMode(mode, current) {
        const question = current
            ? `Restart ${mode.name}? Any game in progress ends.`
            : `Switch to ${mode.name}? Any game in progress ends.`;
        if (!confirm(question)) return;
        await fetch('/api/mode', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: mode.id }),
        });
        refresh();
    }

    const refresh = poll((state) => {
        renderDisplay(state.display);
        renderModes(state);
        renderScores(state);
    });
</script>
</body>
</html>
