# FTP into /home/pi/PinballMachine, logging in as pi with its normal password.
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=002
local_root=/home/pi/PinballMachine
chroot_local_user=YES
allow_writeable_chroot=YES
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.userlist
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
use_localtime=YES
xferlog_enable=YES
utf8_filesystem=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
